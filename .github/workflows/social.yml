name: Morrow Brief

# Posts the day's digest and a few alerts to the Morrow Brief pages when the edition changes.
# On Telegram the digest is one message: every story of the edition, the indexes and the stock
# prices, with the cover above it. The cover is a grid of the outlets' own pictures when at least
# four can be fetched, else the text card.
# The digest goes out at 08:00 Jakarta time: a run that starts between 07:00 and 08:00 waits in the
# publish job until 08:00, then reads the newest page. With no edition in that hour, the digest goes
# out with the first edition after 08:00.
# Three things start a run: the PC publishing an edition (the push), the clock in the bot's
# Cloudflare Worker (once an hour, by workflow_dispatch) and the schedule below. GitHub starts
# scheduled runs hours late or not at all in this repository, so the schedule is only a fallback.
# When the PC has stopped publishing, the edition job builds the page here from the private generator
# repository, so the page and the digest do not depend on that PC. See scripts/social_edition.py.
# A run with nothing new to post changes nothing.
# With no secrets set it sends nothing and records every target as skipped. See docs/SOCIAL.md.

on:
  push:
    branches: [main]
    paths:
      - index.html
  pull_request:
    paths:
      - "scripts/social_*"
      - "tests/social/**"
      - "bot/**"
      - "assets/fonts/**"
      - ".github/workflows/social*.yml"
  schedule:
    # 07:23 to 22:53 in Jakarta, twice an hour.
    - cron: "23,53 0-15 * * *"
  workflow_dispatch:
    inputs:
      cloud_edition:
        description: "Build the page in the cloud: auto = only if the PC has stopped publishing, build = build and check but publish nothing, publish = build and publish now, off = skip."
        type: choice
        options: [auto, build, publish, "off"]
        default: auto
      sample:
        description: "Also post today's digest to the Telegram channel now, as one message without a notification. It does not count as the day's digest."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/social_requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install
        run: pip install -r scripts/social_requirements.txt
      - name: Python tests
        run: python -m unittest discover -s tests/social -v
      - name: Worker tests
        run: node --test bot/worker.test.mjs
      - name: Render what today's page would post
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: python scripts/social_post.py preview --page index.html --out preview
      - name: Keep the preview
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: morrow-brief-preview
          path: preview
          retention-days: 14

  # By hand only. Shows the digest in the real channel, for the day a channel is connected or after a
  # format change. It reads and writes no state, so it cannot affect the day's own posts.
  sample:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.sample && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/social_requirements.txt
      - name: Install
        run: pip install -r scripts/social_requirements.txt
      # Telegram shows the cover as the message's link preview, so the cover has to be at a public
      # URL before the message is sent. The sample's cards go to their own branch, social-sample,
      # which holds one commit and is replaced by the next sample. The day's data is not touched.
      - name: Draw the sample's cards
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "morrow-brief[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git worktree add --detach sample HEAD
          git -C sample rm -rf --quiet .
          python scripts/social_post.py sample --page index.html --out sample --render-only
      - name: Put the cards at a public URL
        run: |
          sha="$(DATA_DIR=sample DATA_BRANCH=social-sample bash scripts/social_save.sh "Morrow Brief sample cards, run $GITHUB_RUN_ID")"
          echo "SAMPLE_SHA=$sha" >> "$GITHUB_ENV"
      - name: Post today's digest to the Telegram channel, without a notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/social_post.py sample --page index.html --out sample --image-wait 90 \
            --image-base "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SAMPLE_SHA}/" \
            --image-base "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/social-data/"
      # The page any reader gets, so the log says whether the post is one message and has its picture.
      - name: What the channel's public page shows now
        run: |
          sleep 20
          python scripts/social_channel.py view || echo "the public page could not be read; look in the app"

  # Builds the page without the PC. It runs the generator from its private repository, which the
  # read-only deploy key in GENERATOR_DEPLOY_KEY opens. Run logs here are public, so the generator's
  # own output goes to a file and only a summary without feeds, tickers or paths is printed.
  # The variable MORROW_CLOUD_EDITION=off switches it off.
  edition:
    needs: test
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: morrow-edition
      cancel-in-progress: false
    env:
      TZ: Asia/Jakarta
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/social_requirements.txt
      - name: Install
        run: pip install -r scripts/social_requirements.txt

      - name: Has the PC stopped publishing?
        id: due
        env:
          MODE: ${{ inputs.cloud_edition || vars.MORROW_CLOUD_EDITION || 'auto' }}
          HAS_KEY: ${{ secrets.GENERATOR_DEPLOY_KEY != '' }}
        run: python scripts/social_edition.py due --page index.html --mode "$MODE" --key "$HAS_KEY"

      - name: Fetch the generator
        if: steps.due.outputs.due == 'true'
        uses: actions/checkout@v7
        with:
          repository: juw12/morrow-news
          ssh-key: ${{ secrets.GENERATOR_DEPLOY_KEY }}
          path: generator
          persist-credentials: false

      # The generator publishes by itself when it finds a GitHub login. Here it must not: the page
      # goes through the gate in the next step first. So it is run with no token in its environment.
      # On the automatic runs a failed build or a refused page is a warning, not a failed run: the
      # published page simply stays. Asked for by hand (build or publish), it fails so that it shows.
      - name: Build the page
        id: build
        if: steps.due.outputs.due == 'true'
        working-directory: generator
        env:
          MODE: ${{ steps.due.outputs.mode }}
        run: |
          set +e
          env -u GITHUB_TOKEN -u GH_TOKEN -u MP_GITHUB_TOKEN \
            timeout 900 python build_news.py --no-open --no-email > ../build.log 2>&1
          code=$?
          set -e
          python ../scripts/social_edition.py buildlog ../build.log
          if [ "$code" -ne 0 ]; then
            echo "::warning::the generator ended with code $code; the published page stays"
            if [ "$MODE" = "auto" ]; then exit 0; fi
            exit "$code"
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Check the built page and put it in place
        id: gate
        if: steps.build.outputs.ok == 'true'
        env:
          MODE: ${{ steps.due.outputs.mode }}
        run: |
          if python scripts/social_edition.py accept --built generator/output/latest.html --generator generator --page index.html; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::the page built in the cloud did not pass the gate; the published page stays"
            if [ "$MODE" != "auto" ]; then exit 1; fi
          fi

      - name: Publish it
        if: steps.gate.outputs.ok == 'true'
        env:
          PUSH: ${{ steps.due.outputs.push }}
        run: |
          if git diff --quiet -- index.html; then
            echo "the built page is the same as the published one; nothing to publish"
            exit 0
          fi
          git diff --shortstat -- index.html
          if [ "$PUSH" != "true" ]; then
            echo "build mode: the page passed the gate and is not published"
            exit 0
          fi
          git config user.name "morrow-brief[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit --quiet -m "edition $(date '+%Y-%m-%d %H:%M') (built in the cloud)"
          # Not forced: if the PC published while this was building, its edition stays.
          if git push origin HEAD:main; then
            echo "published: $(git log -1 --format=%s)"
          else
            echo "main moved while this was building (the PC published); its edition stays"
          fi

  # A page pushed by the edition job does not start a new run (GitHub's rule for its own token), so
  # this job waits for that job and then reads the newest page itself.
  publish:
    needs: [test, edition]
    if: ${{ !cancelled() && needs.test.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # Up to 60 minutes of waiting for 08:00, plus the work itself.
    timeout-minutes: 75
    permissions:
      contents: write
    concurrency:
      group: morrow-social
      cancel-in-progress: false
    env:
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/social_requirements.txt
      - name: Install
        run: pip install -r scripts/social_requirements.txt

      - name: Wait for 08:00 Jakarta time if it is less than an hour away
        run: python scripts/social_post.py hold

      # The code stays the commit that was tested; only the page moves to the newest edition, which
      # may have been published while this run was waiting.
      - name: Read the newest page
        run: |
          git fetch --depth 1 origin main
          git checkout FETCH_HEAD -- index.html

      - name: Open the data branch
        run: |
          git config user.name "morrow-brief[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          git ls-remote --exit-code --heads origin social-data > /dev/null
          found=$?
          set -e
          if [ "$found" -eq 0 ]; then
            git fetch --depth 1 origin social-data
            git worktree add --detach data FETCH_HEAD
          elif [ "$found" -eq 2 ]; then
            echo "social-data does not exist yet, starting empty"
            git worktree add --detach data HEAD
            git -C data rm -rf --quiet .
          else
            # Starting from an empty state here could post today's digest a second time.
            echo "::error::could not read the social-data branch (git exit $found); nothing posted"
            exit 1
          fi

      - name: Pick and freeze the next post
        run: python scripts/social_post.py build --page index.html --out data --run "$RUN_ID"

      - name: Save the claim before anything is sent
        run: |
          sha="$(bash scripts/social_save.sh "Morrow Brief data, run $RUN_ID (before delivery)")"
          echo "DATA_SHA=$sha" >> "$GITHUB_ENV"

      - name: Deliver
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MORROW_BUFFER_CHANNELS: ${{ vars.MORROW_BUFFER_CHANNELS }}
        run: |
          python scripts/social_post.py deliver --out data --run "$RUN_ID" \
            --image-base "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${DATA_SHA}/" \
            --image-base "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/social-data/"

      # One line a day in data/metrics.csv: the subscribers, and the typical views of posts a day to
      # eight days old. It is saved with the rest of the data. A failed reading never stops the run.
      - name: Record the channel's numbers
        if: always() && env.DATA_SHA != ''
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/social_channel.py metrics --out data/metrics.csv

      - name: Save the results
        if: always() && env.DATA_SHA != ''
        run: bash scripts/social_save.sh "Morrow Brief data, run $RUN_ID" "$DATA_SHA"
