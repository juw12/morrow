name: Morrow Brief

# Posts the day's digest and a few alerts to the Morrow Brief pages when the edition changes.
# On Telegram the digest is one message: every story of the edition, with the cover card above it.
# The digest goes out at 08:00 Jakarta time: a run that starts between 07:00 and 08:00 waits in the
# publish job until 08:00, then reads the newest page. With no edition in that hour, the digest goes
# out with the first edition after 08:00.
# The schedule is only a fallback (its 00:17 UTC run is 07:17 in Jakarta). GitHub starts scheduled
# runs hours late or not at all in this repository, so the edition push is what the timing rests on.
# A run with nothing new to post changes nothing.
# With no secrets set it sends nothing and records every target as skipped. See docs/SOCIAL.md.

on:
  push:
    branches: [main]
    paths:
      - index.html
  pull_request:
    paths:
      - "scripts/social_*"
      - "tests/social/**"
      - "bot/**"
      - "assets/fonts/**"
      - ".github/workflows/social*.yml"
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      sample:
        description: "Also post today's digest to the Telegram channel now, as one message without a notification. It does not count as the day's digest."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/social_requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: pip install -r scripts/social_requirements.txt
      - name: Python tests
        run: python -m unittest discover -s tests/social -v
      - name: Worker tests
        run: node --test bot/worker.test.mjs
      - name: Render what today's page would post
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: python scripts/social_post.py preview --page index.html --out preview
      - name: Keep the preview
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: morrow-brief-preview
          path: preview
          retention-days: 14

  # By hand only. Shows the digest in the real channel, for the day a channel is connected or after a
  # format change. It reads and writes no state, so it cannot affect the day's own posts.
  sample:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.sample && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/social_requirements.txt
      - name: Install
        run: pip install -r scripts/social_requirements.txt
      - name: Post today's digest to the Telegram channel, without a notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/social_post.py sample --page index.html --out sample
      # The page any reader gets, so the log says whether the post is one message and has its picture.
      - name: What the channel's public page shows now
        run: |
          sleep 20
          python scripts/social_channel.py view || echo "the public page could not be read; look in the app"

  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Up to 60 minutes of waiting for 08:00, plus the work itself.
    timeout-minutes: 75
    permissions:
      contents: write
    concurrency:
      group: morrow-social
      cancel-in-progress: false
    env:
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/social_requirements.txt
      - name: Install
        run: pip install -r scripts/social_requirements.txt

      - name: Wait for 08:00 Jakarta time if it is less than an hour away
        run: python scripts/social_post.py hold

      # The code stays the commit that was tested; only the page moves to the newest edition, which
      # may have been published while this run was waiting.
      - name: Read the newest page
        run: |
          git fetch --depth 1 origin main
          git checkout FETCH_HEAD -- index.html

      - name: Open the data branch
        run: |
          git config user.name "morrow-brief[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          git ls-remote --exit-code --heads origin social-data > /dev/null
          found=$?
          set -e
          if [ "$found" -eq 0 ]; then
            git fetch --depth 1 origin social-data
            git worktree add --detach data FETCH_HEAD
          elif [ "$found" -eq 2 ]; then
            echo "social-data does not exist yet, starting empty"
            git worktree add --detach data HEAD
            git -C data rm -rf --quiet .
          else
            # Starting from an empty state here could post today's digest a second time.
            echo "::error::could not read the social-data branch (git exit $found); nothing posted"
            exit 1
          fi

      - name: Pick and freeze the next post
        run: python scripts/social_post.py build --page index.html --out data --run "$RUN_ID"

      - name: Save the claim before anything is sent
        run: |
          sha="$(bash scripts/social_save.sh "Morrow Brief data, run $RUN_ID (before delivery)")"
          echo "DATA_SHA=$sha" >> "$GITHUB_ENV"

      - name: Deliver
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MORROW_BUFFER_CHANNELS: ${{ vars.MORROW_BUFFER_CHANNELS }}
        run: |
          python scripts/social_post.py deliver --out data --run "$RUN_ID" \
            --image-base "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${DATA_SHA}/" \
            --image-base "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/social-data/"

      - name: Save the results
        if: always() && env.DATA_SHA != ''
        run: bash scripts/social_save.sh "Morrow Brief data, run $RUN_ID" "$DATA_SHA"
